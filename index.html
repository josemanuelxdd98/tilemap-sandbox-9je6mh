<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nuestro primer año</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Un regalo de aniversario hecho videojuego.">
  <meta name="theme-color" content="#2a1238">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuestro primer año">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8' shape-rendering='crispEdges'%3E%3Crect width='9' height='8' fill='%232a1238'/%3E%3Cpath fill='%23ff5d7e' d='M1 0h3v1H1zM5 0h3v1H5zM0 1h9v3H0zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-estado="cargando">
<div id="app">
  <canvas id="lienzo" aria-label="Juego: Nuestro primer año"></canvas>

  <!-- Botones superiores: sonido y pantalla completa -->
  <div id="barra">
    <button id="btn-pantalla" class="ico" type="button" aria-label="Pantalla completa" title="Pantalla completa" hidden>
      <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M1 1h4v1H2v3H1zM7 1h4v4h-1V2H7zM1 7h1v3h3v1H1zM10 7h1v4H7v-1h3z"/></svg>
    </button>
    <button id="btn-sonido" class="ico" type="button" aria-label="Silenciar" title="Sonido">
      <svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M1 4h2l3-3h1v10H6L3 8H1z"/>
        <g id="ondas"><path fill="currentColor" d="M8 4h1v4H8zM10 2h1v8h-1z"/></g>
        <g id="equis" style="display:none"><path fill="currentColor" d="M8 4h1v1H8zM9 5h1v1H9zM10 6h1v1h-1zM11 7h1v1h-1zM11 4h1v1h-1zM10 5h1v1h-1zM8 6h1v1H8zM7 7h1v1H7z"/></g>
      </svg>
    </button>
  </div>

  <!-- Controles táctiles (se muestran en celular) -->
  <div id="controles" aria-hidden="true">
    <div id="pad-mov">
      <button id="btn-izq" class="cbtn" type="button" tabindex="-1" aria-label="Izquierda">
        <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><polygon fill="currentColor" points="8,0 8,10 1,5"/></svg>
      </button>
      <button id="btn-der" class="cbtn" type="button" tabindex="-1" aria-label="Derecha">
        <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><polygon fill="currentColor" points="2,0 2,10 9,5"/></svg>
      </button>
    </div>
    <button id="btn-salto" class="cbtn" type="button" tabindex="-1" aria-label="Saltar">
      <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><polygon fill="currentColor" points="5,0 10,6 0,6"/><rect fill="currentColor" x="3" y="6" width="4" height="4"/></svg>
      <span class="cbtn-txt">SALTAR</span>
    </button>
  </div>

  <!-- Pantalla de inicio (el título y la escena se dibujan en el lienzo) -->
  <section id="menu">
    <h1 class="solo-lectores">Nuestro primer año</h1>
    <div class="menu-botones">
      <button id="btn-jugar" class="btn grande latido" type="button">Jugar</button>
      <div class="fila">
        <button id="btn-continuar" class="btn peque" type="button" hidden>Continuar</button>
        <button id="btn-recuerdos" class="btn peque" type="button" hidden>Recuerdos</button>
        <button id="btn-ver-carta" class="btn peque dorado" type="button" hidden>Ver carta</button>
      </div>
    </div>
  </section>

  <!-- Tarjeta del recuerdo al terminar cada nivel -->
  <section id="tarjeta" class="capa oculto" role="dialog" aria-modal="true" aria-labelledby="t-titulo">
    <article class="carta-recuerdo">
      <div class="foto-marco"><img id="t-foto" alt="Foto del recuerdo" draggable="false"></div>
      <div class="texto-recuerdo">
        <p class="progreso" id="t-progreso"></p>
        <h2 id="t-titulo"></h2>
        <p class="fecha" id="t-fecha"></p>
        <p class="lugar" id="t-lugar"></p>
        <p class="recuerdo" id="t-texto"></p>
        <p class="stats" id="t-stats"></p>
        <button id="btn-continuar-tarjeta" class="btn" type="button">Continuar</button>
      </div>
    </article>
  </section>

  <!-- Galería de recuerdos -->
  <section id="galeria" class="capa oculto scroll" role="dialog" aria-modal="true" aria-label="Recuerdos">
    <h2>Nuestros recuerdos</h2>
    <div class="rejilla scroll" id="rejilla"></div>
    <button id="btn-cerrar-galeria" class="btn peque" type="button">Cerrar</button>
  </section>

  <!-- Botón para abrir la carta (después del encuentro) -->
  <div id="abrir" class="oculto">
    <button id="btn-abrir-carta" class="btn grande dorado latido" type="button">Abrir carta</button>
  </div>

  <!-- Carta final con efecto de máquina de escribir -->
  <section id="carta" class="capa oculto" role="dialog" aria-modal="true" aria-label="Carta final">
    <article id="papel" class="scroll">
      <button id="btn-saltar" class="btn peque" type="button">Mostrar todo</button>
      <i class="sello" aria-hidden="true"></i>
      <div id="texto-carta"></div>
      <div id="pista" class="pista oculto"><b>Pista de tu regalo</b><span id="pista-texto"></span></div>
      <div id="pie-carta" class="pie-carta oculto">
        <button id="btn-carta-recuerdos" class="btn peque" type="button">Ver recuerdos</button>
        <button id="btn-carta-inicio" class="btn peque dorado" type="button">Volver al inicio</button>
      </div>
    </article>
  </section>

  <!-- Aviso para girar el celular -->
  <section id="girar" class="capa oculto" role="alert">
    <div class="tel" aria-hidden="true"></div>
    <p>Gira tu celular<small>Este juego se juega en horizontal</small></p>
  </section>

  <!-- Cargando -->
  <section id="cargando" class="capa"><i class="corazon" aria-hidden="true"></i>Cargando…</section>
</div>

<noscript><p style="padding:24px;color:#fff;font-family:sans-serif">Este juego necesita JavaScript activado.</p></noscript>
<!-- sonda para leer las zonas seguras (muesca del iPhone) -->
<div id="zona-segura" aria-hidden="true" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>

<script src="js/datos.js"></script>
<script src="js/fuente.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/entrada.js"></script>
<script src="js/arte.js"></script>
<script src="js/tiles.js"></script>
<script src="js/props.js"></script>
<script src="js/escenarios.js"></script>
<script src="js/niveles.js"></script>
<script src="js/motor.js"></script>
<script src="js/principal.js"></script>
</body>
</html>
